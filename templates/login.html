<!doctype html><html><head><title>Login</title>
<style>body{background:#36393f;color:white;display:flex;justify-content:center;align-items:center;height:100vh}
.container{background:#2f3136;padding:40px;border-radius:10px;width:350px}
input,button{width:100%;padding:12px;margin:10px 0;border:none;border-radius:5px}
button{background:#5865F2;color:white;font-weight:bold;cursor:pointer}</style>
</head><body>
<div class="container"><h2>Login</h2>
<form method="POST"><input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button>Login</button></form>
<p>No account? <a href="/register">Register</a></p></div></body></html>
