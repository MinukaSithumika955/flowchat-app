<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowChat - Join Room</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      /* <-- oyage waterfall image eka */
      background: url('/static/background.jpg') no-repeat center fixed;
      background-size: cover; /* 1080p nisa cover thama best */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      position: relative;
      background: rgba(0, 0, 0, 0.45); /* tikak dark karala text penna */
      backdrop-filter: blur(20px);
      padding: 45px 40px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.25);
      z-index: 1;
    }

    .logo { font-size: 60px; margin-bottom: 15px; }
    h1 { 
      font-size: 32px; 
      margin-bottom: 10px; 
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5); /* text penna */
    }
    p { opacity: 0.95; margin-bottom: 35px; font-size: 15px; text-shadow: 0 1px 5px rgba(0,0,0,0.5); }

    .input-group { display: flex; gap: 12px; }
    input {
      flex: 1;
      padding: 16px 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 15px;
      font-size: 16px;
      outline: none;
      background: rgba(255,255,255,0.15);
      color: white;
    }
    input::placeholder { color: rgba(255,255,255,0.8); }
    input:focus { border-color: #00DBDE; background: rgba(255,255,255,0.25); }

    button {
      padding: 16px 28px;
      background: linear-gradient(90deg, #00DBDE 0%, #FC00FF 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 219, 222, 0.4); }

    @media(max-width: 500px) { .input-group { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🌊</div>
    <h1>FlowChat</h1>
    <p>Nature room ekata name ekak danna</p>
    <div class="input-group">
      <input id="room" placeholder="Ex: waterfall-room" onkeypress="if(event.key==='Enter') join()">
      <button onclick="join()">Join</button>
    </div>
  </div>

  <script>
    function join() {
      let room = document.getElementById('room').value.trim();
      if(room) window.location.href = '/room/' + room;
      else alert('Room name ekak danna bro!');
    }
  </script>
</body>
</html>
