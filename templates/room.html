<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowChat - #{{ room }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Whitney', 'Segoe UI', sans-serif; }
    body { background: #36393f; color: #dcddde; height: 100vh; display: flex; overflow: hidden; }
    
    /* Left Server Bar */
    .server-bar { width: 72px; background: #202225; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .server-icon { width: 48px; height: 48px; background: #5865F2; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; transition: 0.2s; }
    .server-icon:hover { border-radius: 16px; background: #5865F2; }

    /* Channel List */
    .channel-list { width: 240px; background: #2f3136; padding: 0 8px; display: flex; flex-direction: column; }
    .channel-header { padding: 18px 10px; font-weight: 700; border-bottom: 1px solid #202225; font-size: 16px; }
    .channels { flex: 1; }
    .channel { padding: 6px 8px; margin: 2px 0; border-radius: 4px; color: #96989d; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .channel:hover { background: #393c43; color: #dcddde; }
    .channel.active { background: #42464d; color: white; }
    .user-panel { padding: 8px; background: #292b2f; display: flex; align-items: center; gap: 8px; }
    .user-panel img { width: 32px; height: 32px; border-radius: 50%; }
    .user-info { flex: 1; }
    .user-name { font-weight: 600; font-size: 14px; }
    .user-status { font-size: 12px; color: #b9bbbe; }
    .user-buttons a { color: #b9bbbe; text-decoration: none; font-size: 18px; padding: 5px; }

    /* Main Chat */
    .chat { flex: 1; display: flex; flex-direction: column; background: #36393f; }
    .chat-header { padding: 15px 20px; border-bottom: 1px solid #202225; font-weight: 600; font-size: 16px; box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
    .chat-header span { color: #72767d; font-weight: 400; }

    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 17px; }
    .message { display: flex; gap: 16px; }
    .message:hover { background: #32353b; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .msg-content { flex: 1; }
    .msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
    .username { font-weight: 600; color: #00b0f4; }
    .time { font-size: 12px; color: #72767d; }
    .msg-text { color: #dcddde; line-height: 1.375; }

    /* Input Box */
    .input-box { padding: 0 16px 24px; }
    .input-wrap { background: #40444b; border-radius: 8px; display: flex; align-items: center; padding: 0 16px; }
    .input-wrap input { flex: 1; background: none; border: none; color: white; padding: 15px 0; font-size: 16px; outline: none; }
    .input-wrap button { background: #5865F2; border: none; color: white; padding: 8px 16px; border-radius: 3px; font-weight: 600; cursor: pointer; }
    .input-wrap button:hover { background: #4752c4; }
    
    /* Member List */
    .member-list { width: 240px; background: #2f3136; padding: 10px; }
    .member-title { padding: 10px; font-size: 12px; font-weight: 700; color: #96989d; text-transform: uppercase; }
    .member { padding: 5px 10px; border-radius: 4px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .member:hover { background: #393c43; }
    .member img { width: 32px; height: 32px; border-radius: 50%; }
    .member-dot { width: 10px; height: 10px; border-radius: 50%; position: relative; left: -15px; top: 10px; border: 2px solid #2f3136; }
    .online { background: #3ba55d; }
    .offline { background: #747f8d; }
  </style>
</head>
<body>
  <!-- Server Icons -->
  <div class="server-bar">
    <div class="server-icon">🔥</div>
  </div>

  <!-- Channel List -->
  <div class="channel-list">
    <div class="channel-header">{{ room }}</div>
    <div class="channels">
      <div class="channel active"># general</div>
      <div class="channel"># gaming</div>
      <div class="channel"># music</div>
    </div>
    <!-- Bottom User Panel -->
    <div class="user-panel">
      <img src="{{ url_for('static', filename='uploads/' + current_user.profile_pic) }}" alt="pfp">
      <div class="user-info">
        <div class="user-name">{{ current_user.username }}</div>
        <div class="user-status">{{ current_user.status }}</div>
      </div>
      <div class="user-buttons">
        <a href="/profile">⚙️</a>
        <a href="/logout">🚪</a>
      </div>
    </div>
  </div>

  <!-- Main Chat -->
  <div class="chat">
    <div class="chat-header"># general <span>- Talk about anything</span></div>
    
    <div class="messages" id="chat"></div>

    <div class="input-box">
      <div class="input-wrap">
        <input id="msg" placeholder="Message #general" onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">Send</button>
      </div>
    </div>
  </div>

  <!-- Member List -->
  <div class="member-list">
    <div class="member-title">ONLINE — 1</div>
    <div class="member">
        <img src="{{ url_for('static', filename='uploads/' + current_user.profile_pic) }}" alt="pfp">
        <div style="position:relative">
          <div class="member-dot {{ current_user.status }}"></div>
        </div>
        {{ current_user.username }}
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io();
    const room = "{{ room }}";
    const username = "{{ username }}"; 

    socket.emit('join', {room: room});

    socket.on('message', function(data){
      const chat = document.getElementById('chat');
      const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      
      chat.innerHTML += `
        <div class="message">
          <img class="avatar" src="/static/uploads/default.png" alt="avatar">
          <div class="msg-content">
            <div class="msg-header">
              <span class="username">${data.user}</span>
              <span class="time">Today at ${time}</span>
            </div>
            <div class="msg-text">${data.msg}</div>
          </div>
        </div>
      `;
      chat.scrollTop = chat.scrollHeight;
    });

    function send() {
      let msg = document.getElementById('msg').value.trim();
      if(msg) {
        socket.emit('message', {room: room, user: username, msg: msg});
        document.getElementById('msg').value = '';
      }
    }
  </script>
</body>
</html>
