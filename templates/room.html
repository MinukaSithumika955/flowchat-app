<!doctype html>
<html>
<head>
  <title>Room: {{ room }}</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body style="background:#111;color:#fff;text-align:center;padding:20px;">
  <h2>Room: {{ room }}</h2>
  <div id="messages" style="height:300px;overflow-y:scroll;border:1px solid #444;padding:10px;"></div>
  <input id="msg" placeholder="Type message">
  <button onclick="send()">Send</button>

  <script>
    const socket = io();
    const room = "{{ room }}";
    socket.emit('join', {room: room});
    
    socket.on('message', (data) => {
      document.getElementById('messages').innerHTML += `<p><b>${data.user}:</b> ${data.msg}</p>`;
    });
    
    function send() {
      let msg = document.getElementById('msg').value;
      socket.emit('message', {room: room, msg: msg, user: 'User'});
      document.getElementById('msg').value = '';
    }
  </script>
</body>
</html>
