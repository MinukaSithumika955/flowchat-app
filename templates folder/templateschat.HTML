<!DOCTYPE html><html><head><title>FlowCHAT - {{room}}</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#25D366">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>*{margin:0} body{background:#0b141a; color:#e9edef; font-family:Segoe UI; height:100vh; display:flex; flex-direction:column}
.header{background:#202c33; padding:12px 16px; border-bottom:1px solid #2a3942} 
.header h2{color:#25D366; font-size:18px}
.chat{flex:1; padding:20px; overflow-y:auto; background:url('https://i.imgur.com/kZV8Q5F.png')}
.msg{max-width:65%; padding:8px 12px; margin:6px 0; border-radius:8px; font-size:14px; line-height:19px} 
.me{background:#005c4b; margin-left:auto; border-top-right-radius:0}
.them{background:#202c33; border-top-left-radius:0} 
.system{text-align:center; color:#8696a0; font-size:12px; margin:10px}
.input{background:#202c33; padding:10px; display:flex; gap:10px}
.input input{flex:1; padding:10px; border-radius:8px; border:none; background:#2a3942; color:#fff; outline:none}
.input button{background:#25D366; border:none; border-radius:50%; width:45px; height:45px; font-size:20px; cursor:pointer}</style></head>
<body><div class="header"><h2>FlowCHAT | Room: {{room}}</h2></div><div class="chat" id="chat"></div>
<div class="input"><input id="msg" placeholder="Type a message"><button onclick="send()">➤</button></div>
<script>var socket=io(); var name="{{name}}"; var room="{{room}}"; socket.emit('join',{name,room});
socket.on('message',function(d){let c=document.getElementById('chat');
c.innerHTML+= d.name=='System'?`<div class="system">${d.msg}</div>`:`<div class="msg ${d.name==name?'me':'them'}"><b>${d.name}:</b> ${d.msg}</div>`;
c.scrollTop=c.scrollHeight;}); function send(){let i=document.getElementById('msg'); if(i.value.trim()){socket.emit('message',{msg:i.value}); i.value='';}}
document.getElementById('msg').addEventListener("keypress",e=>{if(e.key==="Enter")send();});</script></body></html>
